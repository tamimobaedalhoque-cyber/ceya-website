<style>
  /* A lost frame: the viewfinder with nothing in shot, and the way back. */
  body { min-height: 100svh; display: grid; place-items: center; background: var(--ink); }
  .lost { display: grid; justify-items: center; text-align: center; gap: 26px; padding: 0 24px; }
  .lost img { width: clamp(110px, 16vw, 180px); }
  .lost h1 { font-weight: 300; font-size: clamp(44px, 7vw, 112px); line-height: .95; letter-spacing: -.04em; }
  .lost p { max-width: 36ch; color: #C5D8D5; }
  .lost nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 28px; margin-top: 10px; }
  .lost nav a { text-decoration: none; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,.3); transition: color .2s, border-color .2s; }
  .lost nav a:hover { color: var(--sun); border-color: var(--sun); }
  .tc { position: fixed; right: calc(var(--hud) + 44px); top: calc(var(--hud) + 6px); font-size: 13px; color: rgba(255,255,255,.86); font-variant-numeric: tabular-nums; }
</style>
</head>

  <span class="hud-mark hud-mark--tl"></span><span class="hud-mark hud-mark--tr"></span><span class="hud-mark hud-mark--bl"></span><span class="hud-mark hud-mark--br"></span>
